name: Generate animated multiverse banner

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-banner:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image library
        run: python -m pip install --upgrade Pillow
      - name: Generate animated banner
        run: python scripts/generate_multiverse_banner.py
      - name: Commit GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/multiverse-tools-orbit.gif
          if git diff --cached --quiet; then
            echo "Banner is already up to date."
          else
            git commit -m "Generate animated multiverse tools banner"
            git push
          fi
