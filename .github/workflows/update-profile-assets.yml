name: Refresh profile assets

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/generate_technology_banner.py"
      - "scripts/update_public_repositories.py"
      - ".github/workflows/update-profile-assets.yml"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image libraries
        run: python -m pip install --upgrade Pillow CairoSVG
      - name: Refresh public repository list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/update_public_repositories.py
      - name: Generate animated technology banner
        run: python scripts/generate_technology_banner.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/technology-skills-banner.gif
          if git diff --cached --quiet; then
            echo "Profile assets and repository list are already current."
          else
            git commit -m "Refresh profile banner and public repository list"
            git push
          fi
