<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="20" viewBox="0 0 1200 20" role="img" aria-label="Subtle animated cyan-blue divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#287dff" stop-opacity="0"/>
      <stop offset=".25" stop-color="#287dff"/>
      <stop offset=".5" stop-color="#72efff"/>
      <stop offset=".75" stop-color="#6c9cff"/>
      <stop offset="1" stop-color="#287dff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .energy{stroke-dasharray:70 1130;animation:flow 5s linear infinite}
    .spark{animation:flash 2.4s ease-in-out infinite alternate}
    @keyframes flow{to{stroke-dashoffset:-1200}}
    @keyframes flash{from{opacity:.25}to{opacity:.9}}
    @media(prefers-reduced-motion:reduce){.energy,.spark{animation:none}}
  </style>
  <path d="M0 10H1200" stroke="url(#line)" stroke-width="1" opacity=".5"/>
  <path class="energy" d="M0 10H1200" stroke="url(#line)" stroke-width="2" fill="none" filter="url(#glow)"/>
  <circle class="spark" cx="600" cy="10" r="2.2" fill="#eafcff" filter="url(#glow)"/>
</svg>