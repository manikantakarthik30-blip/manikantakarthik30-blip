<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="28" viewBox="0 0 1200 28" role="img" aria-label="Animated blue-to-gold energy divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2787ff" stop-opacity="0"/>
      <stop offset=".18" stop-color="#2787ff"/>
      <stop offset=".42" stop-color="#74f2ff"/>
      <stop offset=".63" stop-color="#ffb34f"/>
      <stop offset=".82" stop-color="#ff583f"/>
      <stop offset="1" stop-color="#ff583f" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .energy { stroke-dasharray: 90 1110; animation: flow 4s linear infinite; }
    .spark { animation: flash 1.8s ease-in-out infinite alternate; }
    @keyframes flow { to { stroke-dashoffset: -1200; } }
    @keyframes flash { from { opacity:.35; } to { opacity:1; } }
    @media (prefers-reduced-motion: reduce) { .energy,.spark { animation:none; } }
  </style>
  <path d="M0 14 H1200" stroke="url(#line)" stroke-width="1.3" opacity=".65"/>
  <path class="energy" d="M0 14 H1200" stroke="url(#line)" stroke-width="3" fill="none" filter="url(#glow)"/>
  <circle class="spark" cx="600" cy="14" r="3" fill="#eafcff" filter="url(#glow)"/>
</svg>