<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="450" viewBox="0 0 1500 450" role="img" aria-labelledby="title desc">
  <title id="title">Manikanta Karthik — Multiverse Developer Portfolio</title>
  <desc id="desc">A dark cosmic banner with electric-blue and violet nebulae, orbital lines, and a glowing multiverse portal on the right.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050914"/>
      <stop offset=".55" stop-color="#080d20"/>
      <stop offset="1" stop-color="#100c29"/>
    </linearGradient>
    <linearGradient id="titleGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1f7ff"/>
      <stop offset=".56" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#b9a7ff"/>
    </linearGradient>
    <linearGradient id="portalLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset=".47" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="blueNebula">
      <stop offset="0" stop-color="#0879d4" stop-opacity=".42"/>
      <stop offset=".48" stop-color="#1554ad" stop-opacity=".18"/>
      <stop offset="1" stop-color="#09204c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetNebula">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".38"/>
      <stop offset=".53" stop-color="#5b21b6" stop-opacity=".16"/>
      <stop offset="1" stop-color="#35115f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="portalCore">
      <stop offset="0" stop-color="#effcff"/>
      <stop offset=".12" stop-color="#67e8f9"/>
      <stop offset=".36" stop-color="#2563eb" stop-opacity=".88"/>
      <stop offset=".67" stop-color="#5b21b6" stop-opacity=".46"/>
      <stop offset="1" stop-color="#080d20" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leftShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050914" stop-opacity=".96"/>
      <stop offset=".48" stop-color="#050914" stop-opacity=".62"/>
      <stop offset="1" stop-color="#050914" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#7899d7" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="blur50" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1500" height="450" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1500" height="450" fill="url(#space)"/>
    <ellipse cx="1030" cy="210" rx="430" ry="270" fill="url(#blueNebula)" filter="url(#blur50)"/>
    <ellipse cx="1280" cy="250" rx="310" ry="290" fill="url(#violetNebula)" filter="url(#blur50)"/>
    <ellipse cx="760" cy="70" rx="260" ry="140" fill="url(#blueNebula)" opacity=".65"/>
    <rect width="1500" height="450" fill="url(#grid)"/>
    <g fill="#c7e8ff">
      <circle cx="74" cy="65" r="1.2" opacity=".55"/><circle cx="132" cy="320" r="1.1" opacity=".5"/>
      <circle cx="214" cy="96" r="1.4" opacity=".6"/><circle cx="301" cy="46" r="1" opacity=".45"/>
      <circle cx="388" cy="342" r="1.5" opacity=".4"/><circle cx="485" cy="126" r="1" opacity=".7"/>
      <circle cx="552" cy="385" r="1.1" opacity=".4"/><circle cx="627" cy="74" r="1.3" opacity=".6"/>
      <circle cx="712" cy="288" r="1" opacity=".65"/><circle cx="788" cy="54" r="1.6" opacity=".65"/>
      <circle cx="842" cy="365" r="1" opacity=".45"/><circle cx="921" cy="86" r="1.4" opacity=".7"/>
      <circle cx="1005" cy="342" r="1.2" opacity=".6"/><circle cx="1127" cy="48" r="1.1" opacity=".55"/>
      <circle cx="1217" cy="367" r="1.5" opacity=".5"/><circle cx="1352" cy="82" r="1.1" opacity=".65"/>
      <circle cx="1440" cy="330" r="1.3" opacity=".55"/><circle cx="1402" cy="172" r="1.1" opacity=".7"/>
      <circle cx="1163" cy="120" r="2" opacity=".8"/><circle cx="1290" cy="303" r="1.5" opacity=".7"/>
    </g>
    <g fill="none" stroke="url(#portalLine)" stroke-opacity=".27">
      <path d="M660 338C850 90 1080 44 1515 106" stroke-width="1.6"/>
      <path d="M700 373C890 150 1090 120 1515 178" stroke-width="1.1" stroke-dasharray="6 15"/>
      <path d="M830 30C1010 158 1250 390 1515 384" stroke-width="1"/>
      <path d="M920 -20C1060 114 1270 252 1510 254" stroke-width="1" stroke-dasharray="3 12"/>
    </g>
    <g transform="translate(1130 225)">
      <circle r="157" fill="none" stroke="#60a5fa" stroke-opacity=".16" stroke-width="1"/>
      <circle r="143" fill="none" stroke="#a78bfa" stroke-opacity=".25" stroke-width="1.2" stroke-dasharray="3 10"/>
      <ellipse rx="184" ry="68" transform="rotate(-28)" fill="none" stroke="#60a5fa" stroke-opacity=".58" stroke-width="2"/>
      <ellipse rx="184" ry="68" transform="rotate(28)" fill="none" stroke="#a78bfa" stroke-opacity=".42" stroke-width="1.6"/>
      <ellipse rx="164" ry="54" transform="rotate(-28)" fill="none" stroke="#67e8f9" stroke-opacity=".24" stroke-width="6" filter="url(#glow)"/>
      <circle r="106" fill="url(#portalCore)"/>
      <circle r="85" fill="none" stroke="url(#portalLine)" stroke-width="2.6" filter="url(#glow)"/>
      <circle r="70" fill="none" stroke="#dbeafe" stroke-opacity=".5" stroke-width="1"/>
      <circle r="51" fill="none" stroke="#67e8f9" stroke-opacity=".55" stroke-width="1.4" stroke-dasharray="2 7"/>
      <circle r="30" fill="none" stroke="#bfdbfe" stroke-opacity=".8" stroke-width="1.5"/>
      <circle r="12" fill="#e0fbff" filter="url(#glow)"/>
      <path d="M0-120V-101M0 101V120M-120 0H-101M101 0H120" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round"/>
      <path d="M-84-84L-70-70M84 84L70 70M84-84L70-70M-84 84L-70 70" stroke="#67e8f9" stroke-opacity=".8" stroke-width="1.4"/>
    </g>
    <g>
      <circle cx="934" cy="156" r="22" fill="#09142f" stroke="#60a5fa" stroke-opacity=".65"/>
      <circle cx="927" cy="148" r="8" fill="#2563eb" fill-opacity=".65"/>
      <circle cx="1345" cy="138" r="14" fill="#100d2d" stroke="#a78bfa" stroke-opacity=".75"/>
      <circle cx="1340" cy="133" r="4" fill="#a78bfa" fill-opacity=".6"/>
      <circle cx="1005" cy="332" r="8" fill="#101b3c" stroke="#67e8f9" stroke-opacity=".8"/>
      <circle cx="1005" cy="332" r="2" fill="#67e8f9"/>
      <circle cx="1268" cy="344" r="5" fill="#a78bfa" fill-opacity=".9"/>
      <circle cx="1268" cy="344" r="13" fill="none" stroke="#a78bfa" stroke-opacity=".4"/>
    </g>
    <rect width="1500" height="450" fill="url(#leftShade)"/>
    <g fill="none" stroke="#67e8f9" stroke-opacity=".55" stroke-width="1.2">
      <path d="M36 64V30H185"/><path d="M1315 30H1464V64"/>
      <path d="M36 386V420H185"/><path d="M1315 420H1464V386"/>
    </g>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="88" y="166" fill="#6ee7f9" font-size="12" font-weight="700" letter-spacing="4">DEVELOPER PORTFOLIO / MULTIVERSE</text>
      <text x="84" y="229" fill="url(#titleGlow)" font-size="49" font-weight="800" letter-spacing="1.1">MANIKANTA KARTHIK</text>
      <rect x="88" y="254" width="54" height="3" rx="1.5" fill="#67e8f9"/>
      <rect x="149" y="254" width="28" height="3" rx="1.5" fill="#8b5cf6"/>
      <text x="88" y="292" fill="#e0e7ff" font-size="17" font-weight="600" letter-spacing="2.1">SOFTWARE  ·  AI  ·  DATA SCIENCE</text>
      <text x="88" y="326" fill="#92a5d4" font-size="12" font-weight="500" letter-spacing="2">BUILDING ACROSS TECHNOLOGY UNIVERSES</text>
      <text x="88" y="375" fill="#647ba9" font-size="9" letter-spacing="2.4">EXPLORE THE CODE. FOLLOW THE ORBIT.</text>
    </g>
    <path d="M88 346H450" stroke="#6e82b4" stroke-opacity=".28"/>
    <text x="1359" y="399" fill="#91a4d6" font-family="monospace" font-size="9" letter-spacing="2" text-anchor="middle">01 / INFINITE POSSIBILITIES</text>
  </g>
</svg>