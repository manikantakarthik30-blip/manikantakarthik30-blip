<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Manikanta's frosted portfolio dashboard</title>
  <desc id="desc">A glassmorphism-style developer dashboard with profile details, real repository links, GitHub statistics panels, and a subtle animated blue light scan.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101b"/><stop offset=".48" stop-color="#152b3b"/><stop offset="1" stop-color="#0a1422"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c3f4ff" stop-opacity=".14"/><stop offset=".5" stop-color="#86bad2" stop-opacity=".065"/><stop offset="1" stop-color="#b9d7e8" stop-opacity=".11"/></linearGradient>
    <linearGradient id="glass2" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7ddef5" stop-opacity=".13"/><stop offset="1" stop-color="#6d87ad" stop-opacity=".045"/></linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a5efff" stop-opacity=".42"/><stop offset="1" stop-color="#b8cce5" stop-opacity=".12"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#57dfff"/><stop offset="1" stop-color="#6497ff"/></linearGradient>
    <radialGradient id="bloom"><stop stop-color="#4dd8fa" stop-opacity=".18"/><stop offset="1" stop-color="#4dd8fa" stop-opacity="0"/></radialGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="glow" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8bcff4" stroke-opacity=".045"/></pattern>
    <clipPath id="clip"><rect width="1200" height="720" rx="16"/></clipPath>
  </defs>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif}
    .eyebrow{font-family:Consolas,monospace;font-size:10px;letter-spacing:1.8px;fill:#86dff8}
    .muted{fill:#abc0cf}.white{fill:#f2f7fc}.sub{fill:#c0d1dc}
    .panel{fill:url(#glass);stroke:url(#stroke);stroke-width:1}
    .inner{fill:url(#glass2);stroke:#a6dbef;stroke-opacity:.14}
    .scan{animation:scan 8s ease-in-out infinite}
    .breathe{animation:breathe 5s ease-in-out infinite}
    .spark{animation:spark 2.6s ease-in-out infinite alternate}
    .chart{stroke-dasharray:500;stroke-dashoffset:500;animation:draw 3.8s ease-out .5s forwards}
    .float{animation:float 7s ease-in-out infinite}
    @keyframes scan{0%,100%{transform:translateY(0);opacity:0}10%{opacity:.5}50%{opacity:.22}90%{opacity:.5}100%{transform:translateY(620px);opacity:0}}
    @keyframes breathe{0%,100%{opacity:.5}50%{opacity:.95}}
    @keyframes spark{from{opacity:.28}to{opacity:1}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @media(prefers-reduced-motion:reduce){.scan,.breathe,.spark,.chart,.float{animation:none}.chart{stroke-dashoffset:0}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="720" fill="url(#background)"/>
    <rect width="1200" height="720" fill="url(#grid)"/>
    <ellipse cx="180" cy="170" rx="300" ry="250" fill="url(#bloom)" filter="url(#blur)"/>
    <ellipse cx="1010" cy="545" rx="350" ry="250" fill="url(#bloom)" filter="url(#blur)"/>
    <path d="M0 0H1200V5H0Z" fill="url(#blue)" opacity=".7"/>
