      <rect x="1091" y="354" width="66" height="20" rx="10" fill="#0e3448" stroke="#8aeaff" stroke-opacity=".45"/><text x="1124" y="367" font-size="9" class="white" text-anchor="middle">Learning</text>
      <text x="780" y="396" font-size="17" font-weight="700" class="white">Python for Data Science</text>
      <text x="780" y="419" font-size="11" class="muted">Practical Python exercises and data-science</text><text x="780" y="436" font-size="11" class="muted">learning notes.</text>
