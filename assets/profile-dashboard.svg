    <circle cx="164" cy="126" r="61" fill="#72dff9" fill-opacity=".12" stroke="#7bdef8" stroke-width="2"/>
    <circle cx="164" cy="126" r="53" fill="#19374a" stroke="#9defff" stroke-opacity=".6"/>
