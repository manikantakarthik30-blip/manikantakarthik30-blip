      <rect x="164" y="371" width="119" height="27" rx="7" class="inner"/><circle cx="176" cy="384.5" r="3" fill="#78a9ff"/><text x="186" y="388">Data Science</text>
      <rect x="44" y="405" width="112" height="27" rx="7" class="inner"/><circle cx="56" cy="418.5" r="3" fill="#70e2fa"/><text x="66" y="422">SQL</text>
