<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Karthik — developer profile banner</title>
  <desc id="desc">Original red-gold armored technology illustration with a glowing chest reactor, electric-blue lightning, and dynamic energy effects.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050913"/><stop offset=".55" stop-color="#111621"/><stop offset="1" stop-color="#220b12"/></linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe9a6"/><stop offset=".22" stop-color="#f2b44b"/><stop offset=".48" stop-color="#c84431"/><stop offset=".8" stop-color="#741e2b"/><stop offset="1" stop-color="#321628"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0b2"/><stop offset=".5" stop-color="#ffb33e"/><stop offset="1" stop-color="#c75a24"/></linearGradient>
    <linearGradient id="electric" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".35" stop-color="#8ef4ff"/><stop offset="1" stop-color="#3e75ff"/></linearGradient>
    <radialGradient id="arc"><stop stop-color="#fff"/><stop offset=".19" stop-color="#b8fbff"/><stop offset=".42" stop-color="#55e8ff" stop-opacity=".9"/><stop offset="1" stop-color="#1e67ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="redGlow"><stop stop-color="#ff6a42" stop-opacity=".3"/><stop offset="1" stop-color="#ff2e37" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#95bdff" stroke-opacity=".07"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect width="1200" height="360" rx="16"/></clipPath>
  </defs>
  <style>
    .spark{animation:twinkle 2.2s ease-in-out infinite alternate}.s2{animation-delay:-1.1s}.s3{animation-delay:-.5s}
    .bolt{fill:none;stroke:url(#electric);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:360;stroke-dashoffset:360;filter:url(#glow);animation:strike 4.2s infinite}
    .bolt.b2{animation-delay:2.05s;stroke-width:2}
    .arcRing{transform-origin:825px 262px;animation:rotate 14s linear infinite}
    .arcPulse{transform-origin:825px 262px;animation:pulse 1.9s ease-in-out infinite}
    .eye{animation:eyePulse 2s ease-in-out infinite}
    .repulse{transform-origin:1010px 260px;animation:repulse 1.7s ease-in-out infinite}
    .scan{animation:scan 4s linear infinite}
    @keyframes twinkle{from{opacity:.2;transform:scale(.7)}to{opacity:1;transform:scale(1.2)}}
    @keyframes strike{0%,8%,100%{stroke-dashoffset:360;opacity:0}12%{opacity:1}25%{stroke-dashoffset:0;opacity:1}31%{opacity:.1}36%{opacity:0}}
    @keyframes rotate{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:.5;transform:scale(.93)}50%{opacity:1;transform:scale(1.08)}}
    @keyframes eyePulse{0%,100%{opacity:.65}50%{opacity:1}}
    @keyframes repulse{0%,100%{opacity:.65;transform:scale(.94)}50%{opacity:1;transform:scale(1.09)}}
    @keyframes scan{0%{transform:translateY(-70px);opacity:0}15%{opacity:.5}85%{opacity:.5}100%{transform:translateY(300px);opacity:0}}
    @media(prefers-reduced-motion:reduce){.spark,.bolt,.arcRing,.arcPulse,.eye,.repulse,.scan{animation:none}.bolt{stroke-dashoffset:0;opacity:.55}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="url(#bg)"/><rect width="1200" height="360" fill="url(#grid)"/>
    <ellipse cx="850" cy="196" rx="390" ry="300" fill="url(#redGlow)"/>
    <g fill="#d8f9ff"><circle class="spark" cx="55" cy="58" r="1.3"/><circle class="spark s2" cx="338" cy="66" r="1.4"/><circle class="spark s3" cx="515" cy="300" r="1.2"/><circle class="spark s2" cx="625" cy="42" r="1.5"/><circle class="spark" cx="1107" cy="58" r="1.4"/><circle class="spark s3" cx="1151" cy="286" r="1.1"/><circle class="spark s2" cx="700" cy="320" r="1.2"/></g>
    <path class="bolt" d="M680 -12 L716 42 L695 70 L738 103 L720 130 L750 160 L731 184"/>
    <path class="bolt b2" d="M1083 -12 L1051 43 L1076 70 L1035 99 L1053 126 L1018 158 L1038 190"/>
    <path class="bolt b2" d="M572 16 L596 50 L579 73 L612 95 L596 118"/>
    <!-- original armored helmet and shoulders -->
    <g stroke-linejoin="round">
      <path d="M707 224 Q688 195 697 150 L720 99 L763 67 L824 55 L884 70 L925 109 L944 157 L936 216 L901 247 L735 247 Z" fill="#090f19" stroke="#60738c" stroke-width="2"/>
      <path d="M720 142 L735 91 L772 67 L824 57 L876 70 L913 101 L931 143 L909 168 L890 209 L858 227 L791 227 L757 208 L739 172 Z" fill="url(#armor)" stroke="url(#gold)" stroke-width="3"/>
      <path d="M772 72 L824 63 L876 74 L858 105 L824 119 L790 105 Z" fill="#8d2630" stroke="#ffd071" stroke-width="2"/>
      <path d="M745 141 L777 119 L810 131 L802 150 L765 154 Z" fill="#071526" stroke="#ffc65b" stroke-width="2"/>
      <path d="M903 141 L871 119 L838 131 L846 150 L883 154 Z" fill="#071526" stroke="#ffc65b" stroke-width="2"/>
      <path class="eye" d="M751 140 L778 126 L799 135 L786 143 Z M897 140 L870 126 L849 135 L862 143 Z" fill="#8ff8ff" filter="url(#glow)"/>
      <path d="M824 116 L811 155 L824 170 L837 155 Z" fill="#ffdf86" stroke="#a52e30" stroke-width="2"/>
      <path d="M786 171 L811 180 L824 175 L837 180 L862 171 L855 204 L824 220 L793 204 Z" fill="#7d202b" stroke="url(#gold)" stroke-width="2"/>
      <path d="M739 173 L715 210 L730 253 L769 281 L798 258 L786 222 L757 208 Z" fill="url(#armor)" stroke="url(#gold)" stroke-width="3"/>
      <path d="M909 173 L933 210 L918 253 L879 281 L850 258 L862 222 L891 208 Z" fill="url(#armor)" stroke="url(#gold)" stroke-width="3"/>
      <path d="M769 245 L790 218 L824 230 L858 218 L879 245 L865 307 L824 331 L783 307 Z" fill="url(#armor)" stroke="url(#gold)" stroke-width="3"/>
      <path d="M790 240 L824 229 L858 240 L849 259 L824 269 L799 259 Z" fill="#2b2130" stroke="#ffbb53" stroke-width="2"/>
      <g class="arcRing" fill="none" stroke="#6bf0ff" stroke-opacity=".9">
        <circle cx="825" cy="262" r="41" stroke-width="3" stroke-dasharray="14 6 3 6"/>
        <circle cx="825" cy="262" r="33" stroke-width="1.5" stroke-dasharray="3 5"/>
      </g>
      <g class="arcPulse"><circle cx="825" cy="262" r="35" fill="url(#arc)"/><circle cx="825" cy="262" r="19" fill="#51dcff" fill-opacity=".38" stroke="#dcffff" stroke-width="2" filter="url(#glow)"/><circle cx="825" cy="262" r="8" fill="#fff" filter="url(#strongGlow)"/></g>
      <!-- repulsor gauntlet -->
      <path d="M929 219 L961 224 L986 244 L1004 265 L987 284 L964 272 L945 254 Z" fill="url(#armor)" stroke="url(#gold)" stroke-width="3"/>
      <g class="repulse"><circle cx="1010" cy="260" r="38" fill="url(#arc)"/><circle cx="1010" cy="260" r="22" fill="#2cdcff" fill-opacity=".24" stroke="#b4fbff" stroke-width="2"/><circle cx="1010" cy="260" r="9" fill="#fff" filter="url(#strongGlow)"/></g>
    </g>
    <path class="scan" d="M670 0 H1085" stroke="#92f4ff" stroke-width="1.5" stroke-opacity=".55"/>
    <g transform="translate(55 0)">
      <text x="0" y="119" font-family="Consolas,monospace" font-size="13" letter-spacing="3" fill="#71e8ff">B.TECH • CSE (DATA SCIENCE)</text>
      <text x="0" y="177" font-family="Segoe UI,Arial,sans-serif" font-size="44" font-weight="800" letter-spacing="1.3" fill="#f7f9ff">B. MANIKANTA</text>
      <text x="2" y="211" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="1.2" fill="#ffbd63">PYTHON  /  DATA  /  SOFTWARE</text>
      <path d="M2 235 H405" stroke="url(#electric)" stroke-width="2"/>
      <text x="2" y="261" font-family="Consolas,monospace" font-size="12" letter-spacing="1.3" fill="#a7b8cc">Engineering practical, data-driven solutions.</text>
      <text x="2" y="285" font-family="Consolas,monospace" font-size="10" letter-spacing="1.5" fill="#6e859f">PYTHON • SQL • MACHINE LEARNING • WEB</text>
    </g>
    <path d="M20 20 H140 M20 20 V52 M1180 20 H1060 M1180 20 V52 M20 340 H140 M20 340 V308 M1180 340 H1060 M1180 340 V308" fill="none" stroke="#7deaff" stroke-opacity=".43" stroke-width="1.3"/>
  </g>
</svg>